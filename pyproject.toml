[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-qc"
version = "0.1.0"
description = "Quality control and H&E alignment checks for 10x Xenium Onboard Analysis output bundles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "polars>=1.0", "pyarrow>=14", "scanpy>=1.10", "anndata>=0.10", "h5py>=3.9",
  "matplotlib>=3.8", "scipy>=1.11", "tifffile>=2024.1", "imagecodecs>=2024.1", "shapely>=2.0", "pyyaml>=6",
  "pillow>=10", "python-igraph>=0.11", "leidenalg>=0.10",
]

[project.optional-dependencies]
multiqc = ["multiqc>=1.25", "multiqc-xenium-extra>=1.0"]
test = ["pytest>=8"]

[project.scripts]
xqc = "xenium_qc.cli:main"

[tool.setuptools]
packages = ["xenium_qc"]

[tool.setuptools.package-data]
xenium_qc = ["data/*.yaml"]
